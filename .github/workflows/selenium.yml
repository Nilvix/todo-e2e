name: Selenium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Google Chrome уже установлен на ubuntu-latest.
      # Драйвер под его версию скачивает Selenium Manager (selenium >= 4.6),
      # поэтому отдельный шаг загрузки ChromeDriver не нужен
      - name: Show Chrome version
        run: google-chrome --version

      - name: Run Selenium tests
        run: pytest -v --html=report.html --self-contained-html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: |
            report.html
            screenshots/
