<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Мои задачи</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="Что нужно сделать?" maxlength="100" autocomplete="off">
      <button id="add-btn" type="submit">Добавить</button>
    </form>
    <p id="error" class="error" hidden></p>
    <div class="filters">
      <button data-filter="all" class="active">Все</button>
      <button data-filter="active">Активные</button>
      <button data-filter="done">Выполненные</button>
    </div>
    <ul id="todo-list"></ul>
    <footer>
      <span id="counter">Осталось задач: 0</span>
      <button id="clear-done">Удалить выполненные</button>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
